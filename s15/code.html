<script>
  function handleCardCopy(element, textToCopy) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textToCopy).catch(() => {});
    }
    
    // Highlight tapped row
    const container = document.getElementById('questions-container');
    if (container) {
      const cards = container.querySelectorAll('button');
      cards.forEach(card => {
        card.classList.remove('bg-secondary-container/30', 'shadow-md');
        card.classList.add('shadow-sm');
        const iconWrap = card.querySelector('div:last-child');
        if (iconWrap) {
          iconWrap.classList.remove('bg-primary', 'text-on-primary');
          iconWrap.classList.add('bg-surface-container-low', 'text-on-surface-variant');
        }
      });
      element.classList.add('bg-secondary-container/30', 'shadow-md');
      element.classList.remove('shadow-sm');
      const activeIconWrap = element.querySelector('div:last-child');
      if (activeIconWrap) {
        activeIconWrap.classList.remove('bg-surface-container-low', 'text-on-surface-variant');
        activeIconWrap.classList.add('bg-primary', 'text-on-primary');
      }
    }

    // Toast bounce effect
    const toast = document.getElementById('copy-toast');
    if (toast) {
      toast.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
      toast.classList.add('opacity-100', 'scale-100');
    }
  }
</script></main>
